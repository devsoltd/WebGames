<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ptero Flap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one 9:16 cabinet centred on a dusk-purple field; HUD and panels float over the canvas. Single dark world by choice. */
:root {
  --field: #140d1a;
  --panel: rgba(31, 18, 38, 0.86);
  --ink: #fff4e3;
  --ink-soft: #e8cfb8;
  --amber: #f2c14e;
  --lava: #e8553e;
  --moss: #7fae4a;
  --font-display: 'Bowlby One', Impact, 'Arial Black', sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--field);
  color: var(--ink);
  font-family: var(--font-body);
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
}
#wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 0 3px #2c1d33, 0 24px 60px rgba(0,0,0,0.55);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}
canvas { display: block; width: 100%; height: 100%; }
#score {
  position: absolute; top: 5%; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(40px, 9vh, 72px);
  line-height: 1;
  color: var(--ink);
  -webkit-text-stroke: 3px #2a1430;
  paint-order: stroke fill;
  text-shadow: 0 4px 0 #2a1430;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
#mute {
  position: absolute; top: 12px; right: 12px;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,244,227,0.35);
  background: rgba(31,18,38,0.55);
  color: var(--ink);
  font: 800 13px var(--font-body);
  cursor: pointer;
}
#mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.panel {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(82%, 300px);
  background: var(--panel);
  border: 2px solid rgba(242,193,78,0.35);
  border-radius: 16px;
  padding: 22px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
  backdrop-filter: blur(4px);
}
.panel h1, .panel h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1;
  text-wrap: balance;
}
.panel h1 { font-size: 40px; color: var(--amber); text-shadow: 0 3px 0 #7a2b1f; }
.panel h2 { font-size: 34px; color: var(--lava); text-shadow: 0 3px 0 #3d1218; }
.era {
  font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-soft);
}
.panel p { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink-soft); line-height: 1.4; }
.keys { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
kbd {
  font: 800 12px var(--font-body);
  padding: 3px 8px; border-radius: 6px;
  background: #3a2541; color: var(--ink);
  border-bottom: 2px solid #1c0f22;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 4px; }
.stat {
  background: rgba(255,244,227,0.06);
  border-radius: 10px; padding: 8px 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.stat span { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; }
.rank { font-size: 14px; font-weight: 800; color: var(--moss); }
.rank em { font-style: normal; color: var(--amber); }
.btn {
  margin-top: 6px;
  font: 400 18px var(--font-display);
  color: #2a1430;
  background: var(--amber);
  border: none; border-radius: 12px;
  padding: 10px 22px;
  box-shadow: 0 4px 0 #a46a16;
  cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a46a16; }
.best-line { font-size: 13px; font-weight: 800; color: var(--amber); }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="game" aria-label="Ptero Flap game area"></canvas>
    <div id="score" hidden>0</div>
    <button id="mute" type="button" aria-label="Mute sound">♪</button>

    <div class="panel" id="ready">
      <span class="era">Late Cretaceous · 68 Ma</span>
      <h1>Ptero Flap</h1>
      <p>Glide your pterodactyl through the basalt pillars. Touch one and you're a fossil.</p>
      <div class="keys"><kbd>Tap</kbd><kbd>Click</kbd><kbd>Space</kbd></div>
      <div class="best-line" id="readyBest"></div>
    </div>

    <div class="panel" id="over" hidden>
      <span class="era">Extinction event</span>
      <h2>Fossilised!</h2>
      <div class="stats">
        <div class="stat"><span>Pillars</span><b id="finalScore">0</b></div>
        <div class="stat"><span>Best</span><b id="finalBest">0</b></div>
      </div>
      <div class="rank">Rank: <em id="rankName">Egg</em></div>
      <button class="btn" id="again" type="button">Fly again</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 360, H = 640, GROUND = 84, FLOOR = H - GROUND;
  const GRAV = 0.42, FLAP = -7.4, SPEED_BASE = 2.3, SPACING = 205, PILLAR_W = 62;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const elScore = document.getElementById('score');
  const elReady = document.getElementById('ready');
  const elOver = document.getElementById('over');
  const elReadyBest = document.getElementById('readyBest');
  const elFinal = document.getElementById('finalScore');
  const elFinalBest = document.getElementById('finalBest');
  const elRank = document.getElementById('rankName');
  const btnAgain = document.getElementById('again');
  const btnMute = document.getElementById('mute');

  let scale = 1;
  function fit() {
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    let w = aw, h = w * 16 / 9;
    if (h > ah) { h = ah; w = h * 9 / 16; }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = cv.width / W;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- storage ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('ptero-best') || '0', 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('ptero-best', String(best)); } catch (e) {} }
  let muted = false;
  try { muted = localStorage.getItem('ptero-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let ac = null;
  function ensureAudio() {
    if (ac || muted) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(f0, f1, dur, type, vol) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    flap() { tone(320, 620, 0.09, 'triangle', 0.12); },
    point() { tone(880, 1320, 0.08, 'square', 0.06); setTimeout(() => tone(1320, 1760, 0.08, 'square', 0.05), 70); },
    hit() { tone(180, 40, 0.35, 'sawtooth', 0.14); },
    screech() { tone(1400, 700, 0.25, 'sawtooth', 0.05); }
  };
  function syncMute() {
    btnMute.textContent = muted ? '✕' : '♪';
    btnMute.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  syncMute();

  // ---------- game state ----------
  let state = 'ready', dino, pillars, particles, score, t = 0, scroll = 0, shake = 0, deadAt = 0, flash = 0;
  function reset() {
    dino = { x: 100, y: H * 0.42, vy: 0, rot: 0, flap: 0 };
    pillars = [];
    particles = [];
    score = 0;
    elScore.textContent = '0';
  }
  reset();
  elReadyBest.textContent = best ? 'Best: ' + best + ' pillars' : '';

  function speed() { return SPEED_BASE + Math.min(score, 60) * 0.012; }
  function gapSize() { return Math.max(128, 162 - score * 0.9); }

  function spawnPillar() {
    const gap = gapSize();
    const min = 70 + gap / 2, max = FLOOR - 50 - gap / 2;
    pillars.push({ x: W + 20, gapY: min + Math.random() * (max - min), gap, passed: false, seed: Math.random() * 1000 });
  }

  function doFlap() {
    dino.vy = FLAP;
    sfx.flap();
    for (let i = 0; i < 4; i++) {
      particles.push({ x: dino.x - 14, y: dino.y + 6, vx: -1 - Math.random() * 1.5, vy: Math.random() * 1.5 - 0.3, life: 1, r: 2 + Math.random() * 2.5 });
    }
  }

  function startGame() {
    reset();
    state = 'playing';
    elReady.hidden = true;
    elOver.hidden = true;
    elScore.hidden = false;
    spawnPillar();
    doFlap();
  }

  function die() {
    state = 'dead';
    deadAt = performance.now();
    sfx.hit();
    setTimeout(sfx.screech, 120);
    shake = reduceMotion ? 0 : 12;
    flash = 1;
    if (score > best) { best = score; saveBest(); }
    setTimeout(() => {
      elFinal.textContent = score;
      elFinalBest.textContent = best;
      elRank.textContent = rankFor(score);
      elScore.hidden = true;
      elOver.hidden = false;
    }, 650);
  }

  function rankFor(s) {
    if (s >= 50) return 'Apex Flyer';
    if (s >= 30) return 'Sky Raptor';
    if (s >= 15) return 'Glider';
    if (s >= 5) return 'Hatchling';
    return 'Egg';
  }

  function press() {
    ensureAudio();
    if (ac && ac.state === 'suspended') ac.resume();
    if (state === 'ready') startGame();
    else if (state === 'playing') doFlap();
    else if (state === 'dead' && performance.now() - deadAt > 750) startGame();
  }

  stage.addEventListener('pointerdown', (e) => {
    if (e.target === btnMute || e.target === btnAgain) return;
    e.preventDefault();
    press();
  });
  btnAgain.addEventListener('click', () => { if (state === 'dead') startGame(); });
  btnMute.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('ptero-muted', muted ? '1' : '0'); } catch (err) {}
    if (!muted) ensureAudio();
    syncMute();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (document.activeElement === btnMute) return;
      e.preventDefault();
      if (e.repeat) return;
      press();
    }
  });

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- update ----------
  function step() {
    t++;
    if (state === 'ready') {
      dino.y = H * 0.42 + Math.sin(t * 0.07) * 9;
      dino.flap += 0.16;
      dino.rot = Math.sin(t * 0.07) * -0.08;
      scroll += SPEED_BASE;
    } else if (state === 'playing') {
      const sp = speed();
      scroll += sp;
      dino.vy = Math.min(dino.vy + GRAV, 10);
      dino.y += dino.vy;
      dino.flap += dino.vy < 0 ? 0.5 : 0.1;
      const targetRot = Math.max(-0.45, Math.min(1.1, dino.vy * 0.075));
      dino.rot += (targetRot - dino.rot) * 0.25;
      if (dino.y < 14) { dino.y = 14; dino.vy = 0; }

      for (const p of pillars) p.x -= sp;
      if (pillars.length && pillars[0].x < -PILLAR_W - 20) pillars.shift();
      const last = pillars[pillars.length - 1];
      if (!last || last.x < W + 20 - SPACING) spawnPillar();

      const r = 12;
      for (const p of pillars) {
        const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
        if (circleRect(dino.x, dino.y, r, p.x - 4, -50, PILLAR_W + 8, top + 50) ||
            circleRect(dino.x, dino.y, r, p.x - 4, bot, PILLAR_W + 8, FLOOR - bot)) { die(); break; }
        if (!p.passed && p.x + PILLAR_W < dino.x) {
          p.passed = true; score++; elScore.textContent = score; sfx.point();
        }
      }
      if (state === 'playing' && dino.y + 12 > FLOOR) { dino.y = FLOOR - 12; die(); }
    } else if (state === 'dead') {
      if (dino.y + 12 < FLOOR) {
        dino.vy = Math.min(dino.vy + GRAV * 1.2, 12);
        dino.y = Math.min(dino.y + dino.vy, FLOOR - 12);
        dino.rot += (1.4 - dino.rot) * 0.15;
      }
    }
    for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.04; }
    particles = particles.filter(pt => pt.life > 0);
    if (shake > 0) shake *= 0.85;
    if (shake < 0.3) shake = 0;
    if (flash > 0) flash = Math.max(0, flash - 0.08);
  }

  // ---------- drawing ----------
  const smoke = Array.from({ length: 7 }, (_, i) => ({ o: i / 7 }));

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR);
    g.addColorStop(0, '#2b1d45');
    g.addColorStop(0.45, '#9c3f63');
    g.addColorStop(0.8, '#ef8a4f');
    g.addColorStop(1, '#f6c26b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, FLOOR);

    // stars at the top
    ctx.fillStyle = 'rgba(255,244,227,0.55)';
    for (let i = 0; i < 18; i++) {
      const sx = (i * 97.3) % W, sy = (i * 53.7) % 150;
      const tw = 0.6 + 0.4 * Math.sin(t * 0.05 + i);
      ctx.globalAlpha = 0.25 + 0.35 * tw;
      ctx.fillRect(sx, sy, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;

    // low sun
    const sg = ctx.createRadialGradient(250, 330, 10, 250, 330, 120);
    sg.addColorStop(0, 'rgba(255,226,150,0.9)');
    sg.addColorStop(0.35, 'rgba(255,190,110,0.35)');
    sg.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(100, 180, 300, 300);
    ctx.fillStyle = '#ffe3a1';
    ctx.beginPath(); ctx.arc(250, 330, 38, 0, Math.PI * 2); ctx.fill();
  }

  function drawVolcano() {
    const off = (scroll * 0.06) % (W + 260);
    const vx = W + 120 - off;
    const by = FLOOR - 70;
    // smoke
    for (const s of smoke) {
      const p = (s.o + t * 0.0025) % 1;
      ctx.fillStyle = `rgba(60,36,60,${0.45 * (1 - p)})`;
      ctx.beginPath();
      ctx.arc(vx + p * 40 + Math.sin(p * 6 + s.o * 9) * 8, by - 150 - p * 140, 10 + p * 28, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#5a2c4c';
    ctx.beginPath();
    ctx.moveTo(vx - 150, by + 40);
    ctx.lineTo(vx - 22, by - 140);
    ctx.lineTo(vx + 22, by - 140);
    ctx.lineTo(vx + 150, by + 40);
    ctx.closePath(); ctx.fill();
    // lava glow + streak
    ctx.fillStyle = '#e8553e';
    ctx.beginPath();
    ctx.moveTo(vx - 22, by - 140); ctx.lineTo(vx + 22, by - 140); ctx.lineTo(vx + 14, by - 132); ctx.lineTo(vx - 14, by - 132);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(242,120,62,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(vx + 4, by - 134); ctx.quadraticCurveTo(vx + 14, by - 90, vx + 6, by - 50); ctx.stroke();
    const gl = ctx.createRadialGradient(vx, by - 145, 2, vx, by - 145, 50);
    gl.addColorStop(0, 'rgba(255,140,70,0.55)'); gl.addColorStop(1, 'rgba(255,140,70,0)');
    ctx.fillStyle = gl; ctx.fillRect(vx - 60, by - 200, 120, 110);
  }

  function hills(par, base, a1, a2, color) {
    const off = scroll * par;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, FLOOR);
    for (let x = 0; x <= W + 8; x += 8) {
      const X = x + off;
      ctx.lineTo(x, base + Math.sin(X * 0.011) * a1 + Math.sin(X * 0.029 + 1.3) * a2);
    }
    ctx.lineTo(W, FLOOR);
    ctx.closePath(); ctx.fill();
  }

  function drawCycads() {
    const par = 0.45, gapX = 150;
    const off = (scroll * par) % gapX;
    for (let i = -1; i < W / gapX + 2; i++) {
      const x = i * gapX - off + 40;
      const idx = Math.floor((scroll * par) / gapX) + i;
      const h = 70 + ((idx * 37) % 40 + 40) % 40;
      const baseY = FLOOR + 4;
      ctx.strokeStyle = '#3a2238'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x + 6, baseY - h / 2, x + 2, baseY - h); ctx.stroke();
      ctx.lineWidth = 4;
      for (let f = 0; f < 6; f++) {
        const a = -Math.PI / 2 + (f - 2.5) * 0.48;
        const sway = Math.sin(t * 0.03 + idx + f) * 0.05;
        const ex = x + 2 + Math.cos(a + sway) * 34, ey = baseY - h + Math.sin(a + sway) * 22 + 10;
        ctx.beginPath(); ctx.moveTo(x + 2, baseY - h);
        ctx.quadraticCurveTo((x + ex) / 2, baseY - h - 18, ex, ey); ctx.stroke();
      }
    }
  }

  function drawPillar(p) {
    const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
    const x = p.x, w = PILLAR_W;
    // top column
    column(x, -10, w, top - 10, p.seed);
    // jagged stalactite tip
    ctx.fillStyle = '#5b3d3a';
    ctx.beginPath();
    ctx.moveTo(x - 4, top - 14);
    for (let i = 0; i <= 6; i++) {
      const px = x - 4 + (w + 8) * i / 6;
      ctx.lineTo(px, top - 14 + (i % 2 === 0 ? 0 : 14));
    }
    ctx.lineTo(x + w + 4, top - 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a302f'; ctx.fillRect(x - 4, top - 22, w + 8, 10);
    // hanging vines
    ctx.strokeStyle = '#5d8a3a'; ctx.lineWidth = 2.5;
    for (let v = 0; v < 3; v++) {
      const vx = x + 10 + v * 20 + ((p.seed * (v + 1)) % 8);
      const len = 16 + ((p.seed * (v + 3)) % 22);
      ctx.beginPath(); ctx.moveTo(vx, top - 16);
      ctx.quadraticCurveTo(vx + Math.sin(t * 0.05 + v) * 4, top - 16 + len / 2, vx + 2, top - 16 + len);
      ctx.stroke();
      ctx.fillStyle = '#7fae4a';
      ctx.beginPath(); ctx.ellipse(vx + 2, top - 16 + len, 3, 2, 0.4, 0, Math.PI * 2); ctx.fill();
    }

    // bottom column
    column(x, bot + 14, w, FLOOR - bot - 14, p.seed + 3);
    // mossy ledge cap
    ctx.fillStyle = '#4a302f'; ctx.fillRect(x - 4, bot + 4, w + 8, 14);
    ctx.fillStyle = '#7fae4a';
    ctx.beginPath(); ctx.moveTo(x - 6, bot + 8);
    for (let i = 0; i <= 10; i++) ctx.lineTo(x - 6 + (w + 12) * i / 10, bot + (i % 2 ? 0 : 6));
    ctx.lineTo(x + w + 6, bot + 10); ctx.lineTo(x - 6, bot + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5d8a3a'; ctx.fillRect(x - 6, bot + 8, w + 12, 4);
  }

  function column(x, y, w, h, seed) {
    if (h <= 0) return;
    ctx.fillStyle = '#7a5144';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#93644f';
    ctx.fillRect(x + 6, y, 10, h);
    ctx.fillStyle = '#5b3d3a';
    ctx.fillRect(x + w - 14, y, 14, h);
    // strata
    ctx.strokeStyle = 'rgba(40,20,25,0.35)'; ctx.lineWidth = 2;
    const start = Math.floor(y / 26) * 26 + (seed % 26);
    for (let sy = start; sy < y + h; sy += 26) {
      if (sy < y) continue;
      ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + w * 0.55, sy + 3); ctx.lineTo(x + w, sy - 1); ctx.stroke();
    }
    // embedded fossil shell, one per column
    const fy = y + h * 0.5;
    if (h > 80) {
      ctx.strokeStyle = 'rgba(232,207,184,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let a = 0; a < 12; a += 0.3) {
        const r = 1 + a * 0.75;
        const px = x + w * 0.42 + Math.cos(a) * r, py = fy + Math.sin(a) * r;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  function drawGround() {
    ctx.fillStyle = '#4a2d2c'; ctx.fillRect(0, FLOOR, W, GROUND);
    ctx.fillStyle = '#5d8a3a'; ctx.fillRect(0, FLOOR, W, 10);
    ctx.fillStyle = '#7fae4a'; ctx.fillRect(0, FLOOR, W, 4);
    const off = scroll % 24;
    ctx.fillStyle = '#3c2324';
    for (let x = -off; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, FLOOR + 22); ctx.lineTo(x + 12, FLOOR + 22); ctx.lineTo(x + 4, FLOOR + 36); ctx.lineTo(x - 8, FLOOR + 36);
      ctx.closePath(); ctx.fill();
    }
    // bones in the dirt
    const boff = (scroll) % 260;
    ctx.strokeStyle = 'rgba(232,207,184,0.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let x = -boff; x < W + 260; x += 260) {
      const by = FLOOR + 56;
      ctx.beginPath(); ctx.moveTo(x + 40, by); ctx.lineTo(x + 66, by - 4); ctx.stroke();
      ctx.fillStyle = 'rgba(232,207,184,0.5)';
      [[40, 0], [66, -4]].forEach(([dx, dy]) => {
        ctx.beginPath(); ctx.arc(x + dx, by + dy - 2, 2.5, 0, Math.PI * 2); ctx.arc(x + dx, by + dy + 2, 2.5, 0, Math.PI * 2); ctx.fill();
      });
    }
  }

  function drawDino() {
    const d = dino;
    const s = Math.sin(d.flap);
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);

    // far wing
    wing(s * 0.85, '#8f3a2e');
    // tail
    ctx.strokeStyle = '#c45a36'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 1); ctx.quadraticCurveTo(-22, 2, -28, 6); ctx.stroke();
    ctx.fillStyle = '#c45a36';
    ctx.beginPath(); ctx.moveTo(-28, 6); ctx.lineTo(-34, 2); ctx.lineTo(-32, 10); ctx.closePath(); ctx.fill();
    // legs
    ctx.strokeStyle = '#8f3a2e'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(-12, 13); ctx.moveTo(-1, 7); ctx.lineTo(-6, 14); ctx.stroke();
    // body
    ctx.fillStyle = '#e07a3f';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3b16a';
    ctx.beginPath(); ctx.ellipse(2, 3, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    // neck
    ctx.strokeStyle = '#e07a3f'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(17, -6); ctx.stroke();
    // crest
    ctx.fillStyle = '#c23b4a';
    ctx.beginPath(); ctx.moveTo(15, -9); ctx.lineTo(0, -20); ctx.lineTo(19, -5); ctx.closePath(); ctx.fill();
    // head
    ctx.fillStyle = '#e07a3f';
    ctx.beginPath(); ctx.ellipse(20, -7, 8.5, 5.8, -0.1, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = '#f2c14e';
    const open = state === 'dead' ? 4 : Math.max(0, -d.vy * 0.25);
    ctx.beginPath(); ctx.moveTo(25, -10); ctx.lineTo(45, -6); ctx.lineTo(26, -5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26, -5); ctx.lineTo(42, -3 + open); ctx.lineTo(25, -2); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#fff4e3';
    ctx.beginPath(); ctx.arc(21, -9, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1c0f22';
    if (state === 'dead') {
      ctx.strokeStyle = '#1c0f22'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(19.5, -10.5); ctx.lineTo(22.5, -7.5); ctx.moveTo(22.5, -10.5); ctx.lineTo(19.5, -7.5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(22, -9, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    // near wing
    wing(s, '#b8482f');
    ctx.restore();
  }

  function wing(s, color) {
    // membrane from shoulder to wing-finger tip, back to hip
    const tipX = -6, tipY = -38 * s;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(6, -3);
    ctx.quadraticCurveTo(10, -22 * s - 2, tipX, tipY);
    ctx.quadraticCurveTo(-14, -14 * s, -12, 2);
    ctx.closePath(); ctx.fill();
    // wing finger bone
    ctx.strokeStyle = '#6e2a22'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, -3); ctx.quadraticCurveTo(10, -22 * s - 2, tipX, tipY); ctx.stroke();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.fillStyle = `rgba(255,244,227,${0.5 * p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.5 - p.life * 0.5), 0, Math.PI * 2); ctx.fill();
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawSky();
    drawVolcano();
    hills(0.15, FLOOR - 120, 22, 10, '#6e3352');
    hills(0.3, FLOOR - 60, 16, 8, '#4f2742');
    drawCycads();
    for (const p of pillars) drawPillar(p);
    drawGround();
    drawParticles();
    drawDino();
    if (flash > 0) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = `rgba(255,244,227,${flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  const DT = 1000 / 60;
  function frame(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= DT) { step(); acc -= DT; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
